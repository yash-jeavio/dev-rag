<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>DevAssist RAG Tester</title>
<style>
	:root {
		--bg: #0f1117;
		--panel: #171a23;
		--border: #2a2e3a;
		--text: #e6e8ee;
		--muted: #8b90a0;
		--accent: #5b8cff;
		--good: #3ecf8e;
		--bad: #ff6b6b;
		--warn: #ffb84d;
	}
	* { box-sizing: border-box; }
	body {
		margin: 0;
		font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
		background: var(--bg);
		color: var(--text);
	}
	header {
		padding: 20px 28px;
		border-bottom: 1px solid var(--border);
	}
	header h1 { margin: 0; font-size: 18px; }
	header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
	main {
		max-width: 1000px;
		margin: 0 auto;
		padding: 24px 28px 60px;
		display: grid;
		gap: 24px;
	}
	.panel {
		background: var(--panel);
		border: 1px solid var(--border);
		border-radius: 10px;
		padding: 20px;
	}
	.panel h2 {
		margin: 0 0 14px;
		font-size: 14px;
		text-transform: uppercase;
		letter-spacing: 0.05em;
		color: var(--muted);
	}
	label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
	input[type=text], textarea, input[type=file] {
		width: 100%;
		background: #0c0e14;
		border: 1px solid var(--border);
		border-radius: 6px;
		color: var(--text);
		padding: 10px 12px;
		font-size: 14px;
		font-family: inherit;
	}
	textarea { resize: vertical; min-height: 70px; }
	.row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
	.row > div { flex: 1; min-width: 200px; }
	button {
		background: var(--accent);
		color: white;
		border: none;
		border-radius: 6px;
		padding: 10px 18px;
		font-size: 14px;
		cursor: pointer;
	}
	button:hover { opacity: 0.9; }
	button:disabled { opacity: 0.5; cursor: default; }
	button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
	.tabs { display: flex; gap: 6px; margin-bottom: 14px; }
	.tabs button.tab { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; font-size: 13px; }
	.tabs button.tab.active { background: var(--accent); color: white; border-color: var(--accent); }
	.hidden { display: none; }
	#docList { display: grid; gap: 8px; margin-top: 14px; }
	.doc-row {
		display: flex; justify-content: space-between; align-items: center;
		padding: 10px 12px; background: #0c0e14; border-radius: 6px; border: 1px solid var(--border);
		font-size: 13px;
	}
	.doc-row .title { font-weight: 600; }
	.doc-row .meta { color: var(--muted); margin-left: 8px; }
	.badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
	.badge.INDEXED { background: rgba(62,207,142,0.15); color: var(--good); }
	.badge.FAILED { background: rgba(255,107,107,0.15); color: var(--bad); }
	.doc-actions button { padding: 5px 10px; font-size: 12px; margin-left: 6px; }
	#answerBox { margin-top: 16px; }
	.status-line { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
	.status-line .badge.ANSWERED { background: rgba(62,207,142,0.15); color: var(--good); }
	.status-line .badge.INSUFFICIENT_CONTEXT { background: rgba(255,184,77,0.15); color: var(--warn); }
	.answer-text { font-size: 15px; line-height: 1.5; padding: 14px; background: #0c0e14; border-radius: 8px; border: 1px solid var(--border); }
	.source {
		margin-top: 10px; padding: 10px 12px; background: #0c0e14; border-radius: 6px;
		border-left: 3px solid var(--border); font-size: 13px;
	}
	.source.cited { border-left-color: var(--good); }
	.source .src-head { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 4px; }
	.source .excerpt { color: var(--text); }
	.muted { color: var(--muted); font-size: 13px; }
	.error-text { color: var(--bad); font-size: 13px; margin-top: 8px; }
	.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: middle; margin-right: 8px; }
	@keyframes spin { to { transform: rotate(360deg); } }
	.menu-btn { padding: 5px 10px; font-size: 14px; margin-left: 6px; line-height: 1; }
	.dropdown-menu {
		position: fixed; z-index: 20; background: var(--panel); border: 1px solid var(--border);
		border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,0.4); min-width: 160px; overflow: hidden;
	}
	.dropdown-menu button {
		display: block; width: 100%; text-align: left; background: transparent; border: none; color: var(--text);
		padding: 10px 14px; font-size: 13px; border-radius: 0; cursor: pointer;
	}
	.dropdown-menu button:hover { background: rgba(255,255,255,0.06); }
	.dropdown-menu button.danger { color: var(--bad); }
	.modal-overlay {
		position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
		align-items: center; justify-content: center; z-index: 30;
	}
	.modal-box {
		background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
		padding: 20px; width: 420px; max-width: 90vw;
	}
	.modal-box h2 { margin-top: 0; font-size: 16px; }
	.modal-box input[type=text] { margin-bottom: 12px; }
	.modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 8px; }
	.modal-fullscreen { width: 90vw; height: 90vh; max-width: none; display: flex; flex-direction: column; }
	.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
	.modal-header h2 { margin: 0; }
	.view-content { flex: 1; overflow-y: auto; background: #0c0e14; border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
	.view-content pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; margin: 0; }
	.view-content h1, .view-content h2, .view-content h3 { margin-top: 1em; }
	.view-content code { background: rgba(255,255,255,0.08); padding: 1px 5px; border-radius: 4px; font-family: monospace; }
	.view-content pre.code-block { background: rgba(255,255,255,0.08); padding: 10px; border-radius: 6px; overflow-x: auto; white-space: pre; }
</style>
</head>
<body>

<header>
	<h1>DevAssist &mdash; RAG Tester</h1>
	<p id="projectLine">Loading project&hellip;</p>
	<p>
		Chat provider:
		<select id="chatProviderSelect">
			<option value="GEMINI">Gemini</option>
			<option value="OPENAI">OpenAI</option>
		</select>
		<span id="chatProviderStatus" class="error-text"></span>
	</p>
</header>

<main>

	<section class="panel">
		<h2>1. Add a document</h2>
		<div class="tabs">
			<button class="tab active" data-tab="text">Paste text</button>
			<button class="tab" data-tab="file">Upload file</button>
		</div>

		<div id="tab-text">
			<div class="row">
				<div>
					<label for="textTitle">Title</label>
					<input type="text" id="textTitle" placeholder="e.g. refund-policy">
				</div>
			</div>
			<label for="textContent">Content</label>
			<textarea id="textContent" placeholder="Paste some text here&hellip;"></textarea>
			<div style="margin-top:12px;">
				<button id="ingestTextBtn">Ingest text</button>
			</div>
		</div>

		<div id="tab-file" class="hidden">
			<label for="fileInput">File (.txt .md .pdf .doc .docx .xls .xlsx .ppt .pptx .html)</label>
			<input type="file" id="fileInput">
			<div style="margin-top:12px;">
				<button id="ingestFileBtn">Ingest file</button>
			</div>
		</div>

		<div id="ingestResult" class="muted" style="margin-top:12px;"></div>
	</section>

	<section class="panel">
		<h2>2. Documents in this project</h2>
		<button class="secondary" id="refreshDocsBtn">Refresh</button>
		<div id="docList"><p class="muted">No documents yet.</p></div>
	</section>

	<section class="panel">
		<h2>3. Ask a question</h2>
		<textarea id="questionInput" placeholder="Ask something about the documents above&hellip;"></textarea>
		<div style="margin-top:12px;">
			<button id="askBtn">Ask</button>
		</div>
		<div id="answerBox"></div>
	</section>

</main>

<div id="docMenu" class="dropdown-menu hidden">
	<button data-action="view">View file</button>
	<button data-action="rename">Rename this file</button>
	<button data-action="delete" class="danger">Delete document</button>
</div>

<div id="viewOverlay" class="modal-overlay hidden">
	<div class="modal-box modal-fullscreen">
		<div class="modal-header">
			<h2 id="viewTitle"></h2>
			<button class="secondary" id="viewCloseBtn">Close</button>
		</div>
		<div id="viewContent" class="view-content"></div>
	</div>
</div>

<div id="renameOverlay" class="modal-overlay hidden">
	<div class="modal-box">
		<h2>Rename document</h2>
		<label for="renameInput">Title</label>
		<input type="text" id="renameInput">
		<div id="renameError" class="error-text"></div>
		<div class="modal-actions">
			<button class="secondary" id="renameCancelBtn">Cancel</button>
			<button id="renameConfirmBtn">Save</button>
		</div>
	</div>
</div>

<div id="deleteOverlay" class="modal-overlay hidden">
	<div class="modal-box">
		<h2>Delete document?</h2>
		<p class="muted">Are you sure you want to delete this document?</p>
		<div id="deleteError" class="error-text"></div>
		<div class="modal-actions">
			<button class="secondary" id="deleteNoBtn">No</button>
			<button id="deleteYesBtn">Yes</button>
		</div>
	</div>
</div>

<script>
	// The UI hides the project concept from the user entirely, per the design
	// agreed for this sub-project: a single default project is created (or
	// reused) automatically, so the experience is "upload, then ask" with no
	// project-picker step. The backend still scopes everything by projectId.
	let projectId = null;

	async function init() {
		const res = await fetch('/api/projects');
		const projects = await res.json();
		if (projects.length > 0) {
			projectId = projects[0].id;
		} else {
			const created = await fetch('/api/projects', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({
					name: 'Default',
					description: 'Auto-created for the manual test UI',
					language: 'N/A',
					repositoryUrl: 'https://example.com/default'
				})
			}).then(r => r.json());
			projectId = created.id;
		}
		document.getElementById('projectLine').textContent = 'Project: ' + projectId;
		await refreshDocs();
	}

	// --- Chat provider toggle ---
	async function loadChatProvider() {
		const res = await fetch('/api/settings/chat-provider');
		const { provider } = await res.json();
		const select = document.getElementById('chatProviderSelect');
		select.value = provider;
		select.dataset.current = provider;
	}

	document.getElementById('chatProviderSelect').addEventListener('change', async (event) => {
		const select = event.target;
		const previousValue = select.dataset.current || select.value;
		const status = document.getElementById('chatProviderStatus');
		status.textContent = '';
		try {
			const res = await fetch('/api/settings/chat-provider', {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ provider: select.value })
			});
			if (!res.ok) {
				select.value = previousValue;
				status.textContent = 'Failed to switch provider.';
				return;
			}
			select.dataset.current = select.value;
		} catch (e) {
			select.value = previousValue;
			status.textContent = 'Failed to switch provider.';
		}
	});

	// --- Tabs ---
	document.querySelectorAll('.tab').forEach(tab => {
		tab.addEventListener('click', () => {
			document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
			tab.classList.add('active');
			document.getElementById('tab-text').classList.toggle('hidden', tab.dataset.tab !== 'text');
			document.getElementById('tab-file').classList.toggle('hidden', tab.dataset.tab !== 'file');
		});
	});

	// --- Ingest text ---
	document.getElementById('ingestTextBtn').addEventListener('click', async () => {
		const title = document.getElementById('textTitle').value.trim();
		const content = document.getElementById('textContent').value.trim();
		const out = document.getElementById('ingestResult');
		if (!content) { out.textContent = 'Content is required.'; return; }

		out.textContent = 'Ingesting (embedding happens now, via Ollama)…';
		try {
			const res = await fetch(`/api/projects/${projectId}/documents/text`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ title: title || 'untitled', content })
			});
			const body = await res.json();
			if (!res.ok) {
				out.innerHTML = `<span class="error-text">${res.status}: ${JSON.stringify(body)}</span>`;
				return;
			}
			out.textContent = body.deduplicated
				? 'Already had this exact content — reused the existing document (no re-embedding).'
				: 'Ingested. Refreshing document list…';
			document.getElementById('textTitle').value = '';
			document.getElementById('textContent').value = '';
			await refreshDocs();
		} catch (e) {
			out.innerHTML = `<span class="error-text">Request failed: ${e}</span>`;
		}
	});

	// --- Ingest file ---
	document.getElementById('ingestFileBtn').addEventListener('click', async () => {
		const fileInput = document.getElementById('fileInput');
		const out = document.getElementById('ingestResult');
		if (!fileInput.files.length) { out.textContent = 'Choose a file first.'; return; }

		const formData = new FormData();
		formData.append('file', fileInput.files[0]);

		out.textContent = 'Uploading and extracting text…';
		try {
			const res = await fetch(`/api/projects/${projectId}/documents`, { method: 'POST', body: formData });
			const body = await res.json();
			if (!res.ok) {
				out.innerHTML = `<span class="error-text">${res.status}: ${JSON.stringify(body)}</span>`;
				return;
			}
			out.textContent = body.deduplicated ? 'Already had this content — reused existing document.' : 'Ingested. Refreshing…';
			fileInput.value = '';
			await refreshDocs();
		} catch (e) {
			out.innerHTML = `<span class="error-text">Request failed: ${e}</span>`;
		}
	});

	// --- Document list + index status ---
	let currentDocs = [];

	async function refreshDocs() {
		const list = document.getElementById('docList');
		const docs = await fetch(`/api/projects/${projectId}/documents`).then(r => r.json());
		currentDocs = docs;
		if (docs.length === 0) {
			list.innerHTML = '<p class="muted">No documents yet.</p>';
			return;
		}
		list.innerHTML = '';
		for (const doc of docs) {
			const status = await fetch(`/api/projects/${projectId}/documents/${doc.id}/index-status`).then(r => r.json());
			const row = document.createElement('div');
			row.className = 'doc-row';
			row.innerHTML = `
				<div>
					<input type="checkbox" class="doc-select" value="${doc.id}" style="margin-right:8px;">
					<span class="title">${escapeHtml(doc.title)}</span>
					<span class="meta">${doc.sourceType} &middot; ${status.chunkCount ?? 0} chunk(s)</span>
					${status.reason ? `<span class="meta error-text">${escapeHtml(status.reason)}</span>` : ''}
				</div>
				<div class="doc-actions">
					<span class="badge ${status.status}">${status.status}</span>
					<button class="secondary" data-summarize="${doc.id}">Summarize</button>
					<button class="secondary menu-btn" data-menu-btn="${doc.id}">&#8942;</button>
				</div>`;
			list.appendChild(row);
		}
		list.querySelectorAll('[data-summarize]').forEach(btn => {
			btn.addEventListener('click', () => summarize(btn.dataset.summarize));
		});
		list.querySelectorAll('[data-menu-btn]').forEach(btn => {
			btn.addEventListener('click', (event) => openDocMenu(event, btn.dataset.menuBtn));
		});
	}
	document.getElementById('refreshDocsBtn').addEventListener('click', refreshDocs);

	// --- Document menu (View / Rename / Delete) ---
	let activeMenuDocId = null;

	function openDocMenu(event, documentId) {
		event.stopPropagation();
		const menu = document.getElementById('docMenu');
		const btnRect = event.target.getBoundingClientRect();
		menu.style.top = `${btnRect.bottom}px`;
		menu.style.left = `${btnRect.left}px`;
		activeMenuDocId = documentId;
		menu.classList.remove('hidden');
	}

	function closeDocMenu() {
		document.getElementById('docMenu').classList.add('hidden');
		activeMenuDocId = null;
	}

	document.getElementById('docMenu').addEventListener('click', async (event) => {
		const action = event.target.dataset.action;
		if (!action || !activeMenuDocId) return;
		const documentId = activeMenuDocId;
		closeDocMenu();
		if (action === 'view') await openViewOverlay(documentId);
		if (action === 'rename') openRenameOverlay(documentId);
		if (action === 'delete') openDeleteOverlay(documentId);
	});

	document.addEventListener('click', (event) => {
		const menu = document.getElementById('docMenu');
		if (!menu.classList.contains('hidden') && !menu.contains(event.target) && !event.target.classList.contains('menu-btn')) {
			closeDocMenu();
		}
	});

	// --- View ---
	async function openViewOverlay(documentId) {
		const overlay = document.getElementById('viewOverlay');
		const titleEl = document.getElementById('viewTitle');
		const contentEl = document.getElementById('viewContent');
		titleEl.textContent = 'Loading…';
		contentEl.innerHTML = '';
		overlay.classList.remove('hidden');
		try {
			const res = await fetch(`/api/projects/${projectId}/documents/${documentId}`);
			const body = await res.json();
			if (!res.ok) {
				titleEl.textContent = 'Error';
				contentEl.innerHTML = `<p class="error-text">${res.status}: ${escapeHtml(body.message || JSON.stringify(body))}</p>`;
				return;
			}
			titleEl.textContent = body.title;
			if (body.sourceType === 'MARKDOWN') {
				contentEl.innerHTML = renderMarkdown(body.content);
			} else {
				contentEl.innerHTML = `<pre>${escapeHtml(body.content)}</pre>`;
			}
		} catch (e) {
			titleEl.textContent = 'Error';
			contentEl.innerHTML = `<p class="error-text">Request failed: ${e}</p>`;
		}
	}
	document.getElementById('viewCloseBtn').addEventListener('click', () => {
		document.getElementById('viewOverlay').classList.add('hidden');
	});

	// A small, dependency-free Markdown renderer covering headers, bold,
	// italic, inline code, fenced code blocks, lists, and links - no
	// external library, per this project's "no new frontend dependency" rule.
	function renderMarkdown(text) {
		const lines = escapeHtml(text).split('\n');
		let html = '';
		let inCodeBlock = false;
		let inList = false;
		for (const line of lines) {
			if (line.startsWith('```')) {
				if (inCodeBlock) {
					html += '</pre>';
					inCodeBlock = false;
				} else {
					if (inList) { html += '</ul>'; inList = false; }
					html += '<pre class="code-block">';
					inCodeBlock = true;
				}
				continue;
			}
			if (inCodeBlock) {
				html += line + '\n';
				continue;
			}
			const headingMatch = line.match(/^(#{1,6})\s+(.*)$/);
			if (headingMatch) {
				if (inList) { html += '</ul>'; inList = false; }
				const level = headingMatch[1].length;
				html += `<h${level}>${inlineMarkdown(headingMatch[2])}</h${level}>`;
				continue;
			}
			const listMatch = line.match(/^[-*]\s+(.*)$/);
			if (listMatch) {
				if (!inList) { html += '<ul>'; inList = true; }
				html += `<li>${inlineMarkdown(listMatch[1])}</li>`;
				continue;
			}
			if (inList) { html += '</ul>'; inList = false; }
			if (line.trim() === '') {
				html += '<br>';
			} else {
				html += `<p>${inlineMarkdown(line)}</p>`;
			}
		}
		if (inList) html += '</ul>';
		if (inCodeBlock) html += '</pre>';
		return html;
	}

	function inlineMarkdown(text) {
		return text
			.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
			.replace(/\*(.+?)\*/g, '<em>$1</em>')
			.replace(/`(.+?)`/g, '<code>$1</code>')
			.replace(/\[(.+?)\]\((.+?)\)/g, (match, label, url) => {
				const trimmedUrl = url.trim();
				const isSafeScheme = /^(https?:|mailto:|#|\/)/i.test(trimmedUrl);
				const safeUrl = (isSafeScheme ? trimmedUrl : '#').replace(/"/g, '&quot;');
				return `<a href="${safeUrl}" target="_blank" rel="noopener">${label}</a>`;
			});
	}

	// --- Rename ---
	function openRenameOverlay(documentId) {
		const doc = currentDocs.find(d => d.id === documentId);
		if (!doc) {
			refreshDocs();
			return;
		}
		const overlay = document.getElementById('renameOverlay');
		const input = document.getElementById('renameInput');
		document.getElementById('renameError').textContent = '';
		input.value = doc.title;
		overlay.dataset.documentId = documentId;
		overlay.classList.remove('hidden');
		input.focus();
	}
	document.getElementById('renameCancelBtn').addEventListener('click', () => {
		document.getElementById('renameOverlay').classList.add('hidden');
	});
	document.getElementById('renameConfirmBtn').addEventListener('click', async () => {
		const overlay = document.getElementById('renameOverlay');
		const documentId = overlay.dataset.documentId;
		const input = document.getElementById('renameInput');
		const errorEl = document.getElementById('renameError');
		const newTitle = input.value.trim();
		errorEl.textContent = '';
		if (!newTitle) { errorEl.textContent = 'Title is required.'; return; }
		try {
			const res = await fetch(`/api/projects/${projectId}/documents/${documentId}/title`, {
				method: 'PUT',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ title: newTitle })
			});
			const body = await res.json();
			if (!res.ok) {
				errorEl.textContent = body.errors ? body.errors[0].message : (body.message || 'Rename failed.');
				return;
			}
			overlay.classList.add('hidden');
			await refreshDocs();
		} catch (e) {
			errorEl.textContent = 'Request failed: ' + e;
		}
	});

	// --- Delete ---
	function openDeleteOverlay(documentId) {
		const overlay = document.getElementById('deleteOverlay');
		document.getElementById('deleteError').textContent = '';
		overlay.dataset.documentId = documentId;
		overlay.classList.remove('hidden');
	}
	document.getElementById('deleteNoBtn').addEventListener('click', () => {
		document.getElementById('deleteOverlay').classList.add('hidden');
	});
	document.getElementById('deleteYesBtn').addEventListener('click', async () => {
		const overlay = document.getElementById('deleteOverlay');
		const documentId = overlay.dataset.documentId;
		const errorEl = document.getElementById('deleteError');
		try {
			const res = await fetch(`/api/projects/${projectId}/documents/${documentId}`, { method: 'DELETE' });
			if (!res.ok) {
				const body = await res.json().catch(() => ({}));
				errorEl.textContent = body.message || `Delete failed (${res.status}).`;
				return;
			}
			overlay.classList.add('hidden');
			await refreshDocs();
		} catch (e) {
			errorEl.textContent = 'Request failed: ' + e;
		}
	});

	async function summarize(documentId) {
		const box = document.getElementById('answerBox');
		box.innerHTML = '<p class="muted"><span class="spinner"></span>Summarizing…</p>';
		try {
			const res = await fetch(`/api/projects/${projectId}/documents/${documentId}/summarize`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({})
			});
			const body = await res.json();
			if (!res.ok) {
				box.innerHTML = `<p class="error-text">${res.status}: ${escapeHtml(body.message || JSON.stringify(body))}</p>`;
				return;
			}
			box.innerHTML = `
				<h2 style="margin-top:0;">Summary of "${escapeHtml(body.title)}"</h2>
				<div class="answer-text">${escapeHtml(body.summary)}</div>
				<p class="muted" style="margin-top:8px;">
					${body.charactersUsed} characters used ${body.truncated ? '(truncated — document was longer)' : ''}
					&middot; ${body.latencyMs}ms
				</p>`;
		} catch (e) {
			box.innerHTML = `<p class="error-text">Request failed: ${e}</p>`;
		}
	}

	// --- Ask a question ---
	document.getElementById('askBtn').addEventListener('click', async () => {
		const question = document.getElementById('questionInput').value.trim();
		const box = document.getElementById('answerBox');
		if (!question) return;

		const documentIds = Array.from(document.querySelectorAll('.doc-select:checked')).map(cb => cb.value);

		box.innerHTML = '<p class="muted"><span class="spinner"></span>Retrieving relevant chunks, then asking Gemini…</p>';
		try {
			const res = await fetch(`/api/projects/${projectId}/query`, {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify({ question, documentIds })
			});
			const body = await res.json();

			if (!res.ok) {
				// A 503 here means the AI provider (Gemini) itself failed —
				// most likely the API key. Surfaced verbatim so it's obvious
				// which layer broke, rather than a generic "request failed".
				box.innerHTML = `<p class="error-text"><strong>${res.status}:</strong> ${escapeHtml(body.message || JSON.stringify(body))}</p>`;
				return;
			}

			let sourcesHtml = '';
			for (const s of body.sources) {
				sourcesHtml += `
					<div class="source ${s.cited ? 'cited' : ''}">
						<div class="src-head">
							<span>${escapeHtml(s.title)} &middot; chunk ${s.chunkIndex}</span>
							<span>${s.cited ? 'cited ✓' : 'retrieved, not cited'} &middot; similarity ${s.similarity.toFixed(3)}</span>
						</div>
						<div class="excerpt">${escapeHtml(s.excerpt)}</div>
					</div>`;
			}

			box.innerHTML = `
				<div class="status-line">
					<span class="badge ${body.status}">${body.status}</span>
					<span class="muted">${body.latencyMs}ms</span>
				</div>
				<div class="answer-text">${escapeHtml(body.answer)}</div>
				${sourcesHtml ? `<h2 style="margin:16px 0 0;">Sources retrieved</h2>${sourcesHtml}` : ''}
			`;
		} catch (e) {
			box.innerHTML = `<p class="error-text">Request failed: ${e}</p>`;
		}
	});

	function escapeHtml(str) {
		const div = document.createElement('div');
		div.textContent = str ?? '';
		return div.innerHTML;
	}

	init();
	loadChatProvider();
</script>

</body>
</html>
