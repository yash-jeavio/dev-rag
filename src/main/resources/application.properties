spring.application.name=devassist
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true

spring.ai.model.embedding=ollama
spring.ai.model.chat=google-genai
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.ollama.init.pull-model-strategy=never
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=gemini-3.6-flash
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=gpt-4o-mini

devassist.rag.top-k=5
devassist.rag.similarity-threshold=0.5
devassist.rag.chunk-size-chars=2000
devassist.rag.chunk-overlap-chars=200
devassist.rag.temperature=0.1
devassist.rag.max-excerpt-chars=300
devassist.rag.summary-max-chars=200000

devassist.eval.project-name=RAG Evaluation Corpus
devassist.eval.dataset-path=classpath:eval/eval-dataset.json
devassist.eval.min-faithfulness=4.0
devassist.eval.min-completeness=4.0
devassist.eval.min-correctly-declined-rate=1.0
