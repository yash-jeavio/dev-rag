# Disables Gemini chat auto-configuration for the whole test suite: with no
# GEMINI_API_KEY in CI/local test environments, the google-genai starter would
# otherwise try to build a real client and fail context startup. This is a
# profile-specific file, so it augments (never shadows) the base
# src/main/resources/application.properties.
#
# Routed to Ollama rather than left as "none": Task 11 wires a ChatClient.Builder
# into GenerationService, and Spring AI's ChatClient autoconfiguration requires a
# ChatModel bean to exist to build it — "none" leaves no ChatModel bean at all and
# fails every full-context test. OllamaChatModel construction (like the existing
# Ollama embedding model below) only builds a client pointed at base-url; it makes
# no network call until actually invoked, which no test does.
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=llama3.1
