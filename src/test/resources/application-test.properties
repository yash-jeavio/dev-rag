# Disables Gemini chat auto-configuration for the whole test suite: with no
# GEMINI_API_KEY in CI/local test environments, the google-genai starter would
# otherwise try to build a real client and fail context startup. This is a
# profile-specific file, so it augments (never shadows) the base
# src/main/resources/application.properties.
spring.ai.model.chat=none
